# Discover (F-DSC-01..09): a seeded member browses the ranked feed, filters it, flips to the map, searches
# for "board" (seeded "Board games night") and opens it. Seed member #6 (+91 90000 10006) lives in a seeded neighbourhood with plans nearby.
appId: app.touchgrass
name: Discover, filter, map and search
---
- launchApp:
    clearState: true
- tapOn: 'Get started'
- tapOn:
    id: phone-input
- inputText: '9000010006'
- tapOn: 'Send code'
- tapOn:
    id: otp-input
- inputText: '000000'
- tapOn: 'Verify'
- runFlow: subflows/skip-after-prompt.yaml
- tapOn:
    id: 'dock-discover'
- assertVisible:
    id: discover-screen
# Explore leads with the featured carousel, then rows of plans.
- assertVisible:
    id: 'hero-seedev.*'
- scrollUntilVisible:
    element:
      id: 'tile-.*-seedev.*'
    direction: DOWN
# Back up to the filter chips. They scroll sideways (time, quick toggles, then Filters), so swipe that row,
# not the screen (a sideways screen swipe would move the featured carousel instead).
- scrollUntilVisible:
    element:
      id: discover-chips
    direction: UP
- repeat:
    times: 4
    while:
      notVisible:
        id: when-weekend
    commands:
      - swipe:
          from:
            id: discover-chips
          direction: LEFT
- tapOn:
    id: when-weekend
- repeat:
    times: 4
    while:
      notVisible:
        id: toggle-soloFriendly
    commands:
      - swipe:
          from:
            id: discover-chips
          direction: LEFT
- tapOn:
    id: toggle-soloFriendly
- repeat:
    times: 4
    while:
      notVisible:
        id: more-filters
    commands:
      - swipe:
          from:
            id: discover-chips
          direction: LEFT
- tapOn:
    id: more-filters
- tapOn:
    id: radius-25
# Clear sits under the category and vibe chips at the end of the panel.
- scrollUntilVisible:
    element:
      id: clear-filters
    direction: DOWN
- tapOn:
    id: clear-filters
- scrollUntilVisible:
    element: 'Map'
    direction: UP
- tapOn: 'Map'
- assertVisible:
    id: discover-map
- tapOn: 'List'
- scrollUntilVisible:
    element:
      id: open-search
    direction: UP
- tapOn:
    id: open-search
- tapOn:
    id: search-input
- inputText: 'board'
- assertVisible:
    id: 'event-seedev.*'
- tapOn:
    id: 'event-seedev.*'
    index: 0
- assertVisible:
    id: event-detail
