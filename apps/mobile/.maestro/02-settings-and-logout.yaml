# Settings, language switching inside the app, replaying the tutorial and logging out (F-ACC-07, F-A11Y-03).
appId: app.touchgrass
name: Settings, language and logout
---
- launchApp
- tapOn:
    id: 'dock-discover'
- tapOn:
    id: 'open-profile'
- scrollUntilVisible:
    element:
      id: 'open-settings'
- tapOn:
    id: 'open-settings'
- tapOn: 'App language'
- tapOn: 'తెలుగు'
- assertVisible: 'యాప్ భాష'
- tapOn: 'English'
- back
- scrollUntilVisible:
    element: 'Replay tutorial'
    direction: DOWN
- tapOn: 'Replay tutorial'
- assertVisible: 'How TouchGrass works'
- tapOn: 'Skip tutorial'
- tapOn:
    id: 'dock-discover'
- tapOn:
    id: 'open-profile'
- scrollUntilVisible:
    element:
      id: 'open-settings'
- tapOn:
    id: 'open-settings'
- scrollUntilVisible:
    element: 'Log out'
    direction: DOWN
- tapOn: 'Log out'
# Confirm in the system dialog ("Log out of TouchGrass on this phone?").
- tapOn:
    id: 'android:id/button1'
- assertVisible: 'Log off. Pull up.'
