# Gate 7: signup with an invite code + full onboarding + tutorial (F-ACC-01..04).
# Backend runs with fake adapters, so OTP 000000 is accepted; the seed provides invite code GRASS-2026.
appId: app.touchgrass
name: Sign up with an invite code and onboard
# Override per run with `maestro test -e PHONE=7xxxxxxxxx …` so each run signs up a new number.
env:
  PHONE: '7012345678'
---
- addMedia:
    - assets/profile.jpg
- launchApp:
    clearState: true
- tapOn: 'I have an invite code'
- tapOn:
    id: invite-input
- inputText: GRASS-2026
- tapOn: 'Check code'
# A valid code goes straight on to the phone number.
- assertVisible: "What's your number?"
- tapOn:
    id: phone-input
- inputText: ${PHONE}
- tapOn: 'Send code'
- tapOn:
    id: otp-input
- inputText: '000000'
- tapOn: 'Verify'
# Onboarding
- assertVisible: 'What should people call you?'
- tapOn:
    id: name-input
- inputText: Maestro Tester
- tapOn: 'Continue'
- assertVisible: 'Add your photos'
# Three photos are needed to continue (D-173): the same test picture three times.
- repeat:
    times: 3
    commands:
      - tapOn: 'Add photo'
      # Android's system photo picker: the pushed test picture is the first tile under "Recent". Tiles have no
      # text, so tap it by position.
      - extendedWaitUntil:
          visible: 'Recent'
          timeout: 10000
      - tapOn:
          point: '16%,34%'
      - tapOn:
          text: 'Crop|Done|Choose'
          optional: true
      - extendedWaitUntil:
          visible:
            id: onboarding-primary
          timeout: 30000
- extendedWaitUntil:
    visible:
      id: remove-photo-3
    timeout: 30000
- tapOn: 'Continue'
# The selfie step (D-181). CI switches the requirement off (a camera can't be scripted), so it steps aside.
- assertVisible: "Show it's really you"
- tapOn: 'Continue'
- tapOn:
    id: dob-day
- inputText: '20'
- tapOn:
    id: dob-month
- inputText: '05'
- tapOn:
    id: dob-year
- inputText: '1998'
- tapOn: 'Continue'
- tapOn: 'Skip'
# Long lists (81 cities, 79 interests) are searched, as people do (D-189).
- tapOn:
    id: city-search
- inputText: 'Hyder'
- tapOn: 'Hyderabad'
- hideKeyboard
- tapOn: 'Continue'
- runFlow:
    when:
      visible:
        id: hood-search
    commands:
      - tapOn:
          id: hood-search
      - inputText: 'Madha'
- tapOn: 'Madhapur'
# No keyboard on this step (on Android, hideKeyboard without one acts as Back).
- tapOn: 'Continue'
- tapOn:
    id: interest-search
- inputText: 'Chai'
- tapOn: '.*Chai runs'
- tapOn:
    id: interest-search
- eraseText
- inputText: 'Biryani'
- tapOn: '.*Biryani hunts'
- tapOn:
    id: interest-search
- eraseText
- inputText: 'hopping'
- tapOn: '.*Café hopping'
- hideKeyboard
- tapOn: 'Continue'
- tapOn: 'Skip'
- tapOn: 'Not now'
- tapOn: 'Not now'
- tapOn: 'Not now'
# Tutorial, then Explore; the profile opens from the avatar at the top
- assertVisible: 'How TouchGrass works'
- tapOn: 'Skip tutorial'
- assertVisible:
    id: 'discover-screen'
- tapOn:
    id: 'open-profile'
- assertVisible: 'Maestro Tester'
