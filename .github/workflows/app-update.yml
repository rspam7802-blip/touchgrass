name: App update

# Publishes a JavaScript-only update (eas update, D-170) to installed builds on a channel, from a clean
# checkout of the chosen commit. Native changes still need a new build. Needs the EXPO_TOKEN secret.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: EAS update channel
        type: choice
        options: [preview, production]
        default: preview
      message:
        description: What changed
        type: string
        required: true

concurrency:
  group: app-update-${{ inputs.channel }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    name: Update (${{ inputs.channel }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @touchgrass/shared build
      - name: Publish
        working-directory: apps/mobile
        env:
          MESSAGE: ${{ inputs.message }}
        run: >-
          npx --yes eas-cli@latest update --non-interactive
          --channel ${{ inputs.channel }} --environment ${{ inputs.channel }}
          --message "$MESSAGE"
